name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-
      # --frozen-lockfile also enforces the supply-chain policy, so a lockfile
      # entry published within the minimum release age fails here rather than
      # reaching a deployment.
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  smoke:
    name: docker compose up
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # A broken Compose setup is a broken build: self-hosting is a first-class
      # deployment mode, so this gates every push rather than being checked by
      # hand when someone remembers.
      - run: ./scripts/smoke.sh
