# The production stack, for Coolify. docker-compose.yml is the local evaluation
# stack and is not safe to expose: it publishes Postgres and storage on host
# ports with credentials that are public in this repository.
#
# What differs here, and why:
#
# - Nothing is published on a host port. Coolify's proxy reaches a service
#   through its network, which is why only cms-server and dashboard declare a
#   SERVICE_URL_* — that is what gives a service a domain.
# - Every secret is generated by Coolify or required before the first deploy.
#   Nothing below is a working default, so a forgotten value stops the deploy
#   instead of starting a server anyone can sign in to.
# - The images are built by CI and pulled, never built on the server. The host
#   this was written for has 4 GB of RAM and no swap, and three Next.js and
#   TypeScript builds would be the thing that kills the neighbours.
#
# The setup, step by step, is in docs/deploy-coolify.md.

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=$SERVICE_USER_POSTGRES
      - POSTGRES_PASSWORD=$SERVICE_PASSWORD_POSTGRES
      - POSTGRES_DB=ainam
    volumes:
      # Postgres 18+ wants the mount one level up, so a future major upgrade can
      # use `pg_upgrade --link` without crossing a mount boundary.
      - ainam-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  garage:
    image: dxflrs/garage:v2.3.0
    restart: unless-stopped
    environment:
      # Override the placeholder secrets in garage.toml, which are public. Neither
      # service is reachable from outside this stack, but a secret that is also in
      # the repository is not a secret.
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET:?}
      - GARAGE_ADMIN_TOKEN=$SERVICE_PASSWORD_GARAGEADMIN
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - ainam-garage-meta:/var/lib/garage/meta
      - ainam-garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Assigns the layout, creates the bucket and imports the key. Runs on every
  # deploy and is safe to repeat. Excluded from the application's health, since
  # exiting is how it succeeds.
  garage-init:
    image: ghcr.io/jansirproxx/ainam-garage-init:${AINAM_VERSION:-latest}
    pull_policy: always
    restart: "no"
    exclude_from_hc: true
    environment:
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET:?}
      - GARAGE_ADMIN_TOKEN=$SERVICE_PASSWORD_GARAGEADMIN
      - STORAGE_BUCKET=ainam
      - STORAGE_ACCESS_KEY_ID=${STORAGE_ACCESS_KEY_ID:?}
      - STORAGE_SECRET_ACCESS_KEY=${STORAGE_SECRET_ACCESS_KEY:?}
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
    depends_on:
      garage:
        condition: service_healthy

  cms-server:
    image: ghcr.io/jansirproxx/ainam-cms-server:${AINAM_VERSION:-latest}
    # Pulled on every deploy: `latest` moves, and a redeploy that kept the old
    # layers would report success while running yesterday's code.
    pull_policy: always
    restart: unless-stopped
    environment:
      - SERVICE_URL_CMS_SERVER_8787
      # Refuses to start with the placeholder secret from .env.example.
      - NODE_ENV=production
      - PORT=8787
      - DATABASE_URL=postgres://$SERVICE_USER_POSTGRES:$SERVICE_PASSWORD_POSTGRES@postgres:5432/ainam
      - BETTER_AUTH_SECRET=$SERVICE_PASSWORD_64_AUTH
      - BETTER_AUTH_URL=$SERVICE_URL_CMS_SERVER_8787
      - DASHBOARD_ORIGIN=$SERVICE_URL_DASHBOARD_3000
      - SIGNUP_MODE=${SIGNUP_MODE:-open}
      # `console` prints invitation and reset links to this container's log. Set
      # `smtp` and SMTP_URL to send them.
      - MAIL_TRANSPORT=${MAIL_TRANSPORT:-console}
      - SMTP_URL=${SMTP_URL:-}
      - MAIL_FROM=${MAIL_FROM:-AINAM <ainam@localhost>}
      - STORAGE_ENDPOINT=http://garage:3900
      - STORAGE_REGION=garage
      - STORAGE_BUCKET=ainam
      - STORAGE_ACCESS_KEY_ID=${STORAGE_ACCESS_KEY_ID:?}
      - STORAGE_SECRET_ACCESS_KEY=${STORAGE_SECRET_ACCESS_KEY:?}
      - STORAGE_FORCE_PATH_STYLE=true
      # Empty: uploaded images stream through this server. That works with no
      # bucket policy and no extra domain, and makes this server a single point of
      # failure for a customer's images. Set it to a public HTTPS address in front
      # of Garage's web port once there is one.
      - STORAGE_PUBLIC_URL=${STORAGE_PUBLIC_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
    healthcheck:
      # No curl in the runtime image, and adding one to serve a healthcheck would
      # be a package every self-hoster downloads for our convenience.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:8787/health').then(r=>r.json()).then(b=>process.exit(b.database==='up'?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20

  dashboard:
    image: ghcr.io/jansirproxx/ainam-dashboard:${AINAM_VERSION:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      - SERVICE_URL_DASHBOARD_3000
      # The address a visitor's browser uses, read when the container starts.
      - CMS_PUBLIC_URL=$SERVICE_URL_CMS_SERVER_8787
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      cms-server:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  ainam-postgres:
  ainam-garage-meta:
  ainam-garage-data:
