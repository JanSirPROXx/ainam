# The local evaluation stack. `docker compose up` from a clean checkout must
# always work — a broken Compose setup is a broken build.
#
# Every value below has a default, so this runs with or without a .env file.
# Host ports are overridable — POSTGRES_PORT, CMS_PORT, DASHBOARD_PORT — because
# 3000 and 5432 are commonly already taken on a developer's machine.
# NODE_ENV stays at development here: the placeholder secret in .env.example is
# public, and cms-server refuses to start with it when NODE_ENV=production. A
# real deployment sets both.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ainam
      POSTGRES_PASSWORD: ainam
      POSTGRES_DB: ainam
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ wants the mount one level up, so data lands in a
      # version-named subdirectory and a future major upgrade can use
      # `pg_upgrade --link` without crossing a mount boundary.
      - ainam-postgres:/var/lib/postgresql
    healthcheck:
      # cms-server applies migrations at startup, so it must not start against a
      # database that is still initialising.
      test: ["CMD-SHELL", "pg_isready -U ainam -d ainam"]
      interval: 2s
      timeout: 3s
      retries: 30

  cms-server:
    build:
      context: .
      dockerfile: apps/cms-server/Dockerfile
    environment:
      DATABASE_URL: postgres://ainam:ainam@postgres:5432/ainam
      PORT: "8787"
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-development-only-secret-not-for-any-deployment}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8787}
      DASHBOARD_ORIGIN: ${DASHBOARD_ORIGIN:-http://localhost:3000}
      # Console by default, so a clean checkout can invite an editor and reset a
      # password without a mail server or an account anywhere.
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-console}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-AINAM <ainam@localhost>}
      SIGNUP_MODE: ${SIGNUP_MODE:-open}
    ports:
      - "${CMS_PORT:-8787}:8787"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # No curl in the runtime image, and adding one to serve a healthcheck
      # would be a package we ship to every self-hoster for our convenience.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:8787/health').then(r=>r.json()).then(b=>process.exit(b.database==='up'?0:1)).catch(()=>process.exit(1))"
      interval: 3s
      timeout: 3s
      retries: 20

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    environment:
      NEXT_PUBLIC_CMS_URL: ${NEXT_PUBLIC_CMS_URL:-http://localhost:8787}
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      cms-server:
        condition: service_healthy
    healthcheck:
      # Without this, `--wait` returns as soon as the container starts and a
      # caller can reach a server that is not yet serving.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 3s
      timeout: 3s
      retries: 20

  # The reference template. It renders from its committed snapshot until
  # AINAM_PROJECT_ID and AINAM_API_KEY are set, so `docker compose up` hands an
  # evaluator a running website rather than a curl target — and demonstrates the
  # build-time fallback by being in it.
  starter:
    build:
      context: .
      dockerfile: examples/starter-next/Dockerfile
    environment:
      AINAM_URL: http://cms-server:8787
      AINAM_PROJECT_ID: ${AINAM_PROJECT_ID:-}
      AINAM_API_KEY: ${AINAM_API_KEY:-}
      AINAM_WEBHOOK_SECRET: ${AINAM_WEBHOOK_SECRET:-}
      AINAM_PREVIEW_API_KEY: ${AINAM_PREVIEW_API_KEY:-}
    ports:
      - "${STARTER_PORT:-3200}:3200"
    depends_on:
      cms-server:
        condition: service_healthy
    healthcheck:
      # Without this, `--wait` returns as soon as the container starts and a
      # caller can reach a server that is not yet serving.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3200/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  ainam-postgres:
