packages:
  - "apps/*"
  - "packages/*"
  - "examples/*"

# pnpm blocks dependency install scripts until each is decided explicitly. Every
# entry here is a deliberate call about letting third-party code run at install
# time, so the list stays short and argued.
#
# esbuild: declined. It ships its platform binaries as optional dependencies, so
# the install script is redundant — verified by running tsx and drizzle-kit
# without it.
allowBuilds:
  esbuild: false
